# Standard ROS 2 Parameter File
camera_node:
  ros__parameters:
    video_device: "/dev/video0"
    image_size: [640, 480]
    pixel_format: "YUYV"
    camera_frame_id: "camera_link"

yolo_vision_node:
  ros__parameters:
    model_name: "yolo11n.pt"
    device: "cpu"
    conf_threshold: 0.50
    target_class: "bottle"
    custom_classes: ["conical centrifuge tube with blue cap"]
    target_pixel_x: 320   #prev: 640
    target_pixel_y: 240   #prev: 480
    target_area_px: 40000

ibvs_controller_node:
  ros__parameters:
    gain_x: 0.5
    gain_y: 0.5
    gain_z: 0.001
    max_translation_speed_m_s: 0.05
    tolerance_px: 15
    tolerance_area: 1500

grasp_manager_node:
  ros__parameters:
    # Fixed Scanning Pose in Joint Space: [joint1, joint2, joint3, joint4, joint5, joint6] (rad)
    #scanning_joints: [0.0, -0.5, 0.5, 0.0, -1.0, 0.0]
    scanning_joints: [0.0, -0.6528, -0.7749, 0.8011, 0.0, 0.0]
    scanning_pose_duration: 3.0
