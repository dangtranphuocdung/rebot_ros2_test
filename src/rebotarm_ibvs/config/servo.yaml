###############################################
# Modify all parameters related to servoing here
###############################################
use_gazebo: false # Whether the robot is started in a Gazebo simulation environment

## Properties of incoming commands
command_in_type: "speed_units" # "unitless"> in the range [-1:1], as if from joystick. "speed_units"> cmds are in m/s and rad/s
scale:
  # Scale parameters are only used if command_in_type=="unitless"
  linear:  0.4  # Max linear velocity. Unit is [m/s]. Only used for Cartesian commands.
  rotational:  0.8 # Max angular velocity. Unit is [rad/s]. Only used for Cartesian commands.
  # Max joint angular/linear velocity. Only used for joint commands on joint_command_in_topic.
  joint: 0.5

# What type of topic does your robot driver expect?
# Currently supported are std_msgs/Float64MultiArray or trajectory_msgs/JointTrajectory
command_out_type: trajectory_msgs/JointTrajectory

# What to publish? Can save some bandwidth as most robots only require positions or velocities
publish_positions: true
publish_velocities: true
publish_accelerations: false
publish_period: 0.01 # 100Hz
## Plugins for smoothing outgoing commands
smoothing_filter_plugin_name: "online_signal_smoothing::ButterworthFilterPlugin"

# If is_primary_planning_scene_monitor is set to true, the Servo server's PlanningScene building node will be allowed to load kinematic plugins. This should be set to true when Servo is the primary node where planning scene is constructed, e.g. in standalone Jacobian or IK kinematics.
is_primary_planning_scene_monitor: false
check_validity: false # Check collision and kinematics limits?

# Collision checking distance thresholds
collision_check_rate: 10.0 # [Hz] Collision-checking can easily bog down a CPU if done too often.
# Two collision check algorithms are available:
# "threshold_distance" begins slowing down when robot is nearer than stop_distance. Good for the PID approach.
# "stop_distance" stops the robot when collision_distance < stop_distance. Good for the Jacobian approach.
collision_check_type: threshold_distance
# Parameters for "threshold_distance"-type collision checking
self_collision_proximity_threshold: 0.01 # Start decelerating when a self-collision is this far [m]
scene_collision_proximity_threshold: 0.02 # Start decelerating when a scene collision is this far [m]
# Parameters for "stop_distance"-type collision checking
collision_distance_safety_factor: 1000.0 # Must be >= 1. A large safety factor is recommended to account for latency
min_allowable_collision_distance: 0.01 # Stop if a collision is closer than this [m]

# Kinematics limits
joint_limit_margin: 0.1 # added as a buffer to joint limits [rad]. If moving quickly, make this larger.
lower_singularity_threshold:  20.0 # Start decelerating when the condition number hits this (close to singularity)
hard_singularity_threshold:    30.0 # Stop when the condition number hits this
leaving_singularity_factor: 0.5 # Multiply the command by this factor when moving away from a singularity. (>1.0 to move away faster)

# Topic names
cartesian_command_in_topic: ~/delta_twist_cmds  # Topic for incoming Cartesian twist commands
joint_command_in_topic: ~/delta_joint_cmds # Topic for incoming joint angle commands
joint_topic: /joint_states
status_topic: ~/status # Publish status to this topic
command_out_topic: /rebotarm_controller/joint_trajectory # Publish outgoing commands here

# Frame names
command_out_frame: base_link # The frame to which the outgoing command applies
robot_link_command_frame: gripper_tcp  # The frame in which the incoming Twist commands will be applied
ee_frame_name: gripper_tcp # The frame of the end effector (gripper tool center point)
planning_frame: base_link # The MoveIt planning frame. Often 'base_link' or 'world'

# Group names
move_group_name: arm  # Often 'manipulator' or 'arm'

